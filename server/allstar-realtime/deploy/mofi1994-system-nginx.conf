map $http_upgrade $allstar_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name mofi1994.xyz;

    location /.well-known/acme-challenge/ {
        root /www/wwwroot/143_20_149_27;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mofi1994.xyz;

    ssl_certificate /www/server/panel/vhost/cert/mofi1994.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/mofi1994.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ALLSTAR_SSL:10m;
    ssl_session_timeout 10m;

    location /allstar/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $allstar_connection_upgrade;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 86400s;
    }

    location / {
        return 404;
    }
}
